<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blog crochê</title>
    <style>
        header {
            background-color: darkmagenta;
            color: #FFFFFF;
            text-align: center;
            max-width: 800px;
            margin: 0 auto;
            padding: 16px;
        }

        main {
            background-color: #FFFFFF;
            color: lightpink;
            max-width: 800px;
            margin: 0 auto;
            padding: 16px;
            display: flex;
        }

        img {
            width: 80px;
            height: 80px;
        }

        .artigo-autor {
            font-weight: bold.;
        }
    </style>
</head>
<body>
    <header>
        <h1>Meu blog de croche</h1>
        <p>ideias, tutoriais e muito mais!</p>
    </header>

    <main>
        <img src="imagem-blog.png" alt="Logotipo conceitual de tecnologia e educação: um livro aberto de onde emerge um cérebro digital brilhante, cercado por ícones de Wi-Fi, circuitos e lâmpada de ideia. Cores em tons de azul e branco.">
        <div>
            <h2>Meu primeiro post</h2>
            <p class="artigo-autor">Por: Marcelo Paludetto</p>
            <p>Boas-vindas ao meu novo blog! Neste blog vou postar dicas de croche e ideias facieis a mais complexas.</p>
            <button> ❤️ <span>0</span></button>
        </div>
    </main>

    <script>
        const botao = document.querySelector("button");
        botao.addEventListener("click", botaoClicado);

        function botaoClicado() {
            console.log("Fui clicado");
            let texto = botao.querySelector("span");
            texto.textContent++;
        }
    </script>
</body>
</html>
